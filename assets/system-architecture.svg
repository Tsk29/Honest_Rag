<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" font-family="'Segoe UI', Roboto, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8c7fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#81c995"/>
    </marker>
  </defs>

  <rect width="1100" height="900" fill="#131314"/>

  <text x="550" y="44" text-anchor="middle" fill="#e3e3e3" font-size="26" font-weight="600">HonestRAG — System Architecture</text>
  <text x="550" y="70" text-anchor="middle" fill="#9aa0a6" font-size="14">two UIs over one shared RAG layer · local or hosted vector store · tested, versioned delivery</text>

  <!-- ============================ RUNTIME ============================ -->
  <text x="40" y="104" fill="#a8c7fa" font-size="13" font-weight="600" letter-spacing="2">RUNTIME</text>

  <!-- UI layer container -->
  <rect x="190" y="116" width="720" height="96" rx="18" fill="none" stroke="#3c4043" stroke-dasharray="5 5"/>
  <text x="206" y="134" fill="#9aa0a6" font-size="11">UI layer</text>

  <rect x="220" y="142" width="310" height="56" rx="14" fill="#1e1f20" stroke="#3c4043"/>
  <text x="375" y="166" text-anchor="middle" fill="#e3e3e3" font-size="15">Streamlit UI · app.py</text>
  <text x="375" y="185" text-anchor="middle" fill="#9aa0a6" font-size="12">local run &amp; Docker image</text>

  <rect x="570" y="142" width="310" height="56" rx="14" fill="#1e1f20" stroke="#a8c7fa"/>
  <text x="725" y="166" text-anchor="middle" fill="#e3e3e3" font-size="15">Gradio UI · gradio_app.py</text>
  <text x="725" y="185" text-anchor="middle" fill="#9aa0a6" font-size="12">Hugging Face Space</text>

  <!-- UI -> rag_service -->
  <line x1="550" y1="212" x2="550" y2="246" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="234" fill="#9aa0a6" font-size="11">upload · remove · clear</text>

  <!-- UI -> workflow (questions) -->
  <line x1="240" y1="212" x2="240" y2="356" stroke="#a8c7fa" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="150" y="262" fill="#a8c7fa" font-size="11">questions ↓</text>
  <text x="150" y="278" fill="#a8c7fa" font-size="11">streamed</text>
  <text x="150" y="292" fill="#a8c7fa" font-size="11">answers ↑</text>

  <!-- rag_service -->
  <rect x="330" y="250" width="440" height="60" rx="16" fill="#1e1f20" stroke="#3c4043"/>
  <text x="550" y="275" text-anchor="middle" fill="#e3e3e3" font-size="15">rag_service.py — shared by both UIs</text>
  <text x="550" y="295" text-anchor="middle" fill="#9aa0a6" font-size="12">load &amp; tag PDFs · embed &amp; index · remove sources · build the workflow</text>

  <line x1="400" y1="310" x2="340" y2="356" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="338" text-anchor="end" fill="#9aa0a6" font-size="11">builds</text>
  <line x1="550" y1="310" x2="550" y2="356" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="310" x2="820" y2="356" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="772" y="330" fill="#9aa0a6" font-size="11">embed chunks</text>

  <!-- Row 3: core components -->
  <rect x="60" y="360" width="330" height="84" rx="16" fill="#1e1f20" stroke="#a8c7fa" stroke-width="1.5"/>
  <text x="225" y="386" text-anchor="middle" fill="#e3e3e3" font-size="15">workflow.py · CorrectiveRAGWorkflow</text>
  <text x="225" y="406" text-anchor="middle" fill="#9aa0a6" font-size="12">retrieve → grade (concurrent) → decide</text>
  <text x="225" y="422" text-anchor="middle" fill="#9aa0a6" font-size="12">→ web fallback → stream answer → critique</text>

  <rect x="420" y="360" width="260" height="84" rx="16" fill="#1e1f20" stroke="#3c4043"/>
  <text x="550" y="386" text-anchor="middle" fill="#e3e3e3" font-size="15">knowledge_base.py</text>
  <text x="550" y="406" text-anchor="middle" fill="#9aa0a6" font-size="12">Milvus connection from env</text>
  <text x="550" y="422" text-anchor="middle" fill="#9aa0a6" font-size="12">source list read from the store</text>

  <rect x="710" y="360" width="330" height="84" rx="16" fill="#1e1f20" stroke="#3c4043"/>
  <text x="875" y="386" text-anchor="middle" fill="#e3e3e3" font-size="15">FastEmbed embeddings</text>
  <text x="875" y="406" text-anchor="middle" fill="#9aa0a6" font-size="12">BAAI/bge-large-en-v1.5 · 1024-dim</text>
  <text x="875" y="422" text-anchor="middle" fill="#9aa0a6" font-size="12">ONNX on CPU · baked into Docker image</text>

  <!-- Row 3 -> externals -->
  <line x1="150" y1="444" x2="150" y2="506" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="472" fill="#9aa0a6" font-size="11">grade · rewrite</text>
  <text x="160" y="487" fill="#9aa0a6" font-size="11">answer · critique</text>
  <path d="M320,444 L320,492 L450,492 L450,506" fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="328" y="484" fill="#9aa0a6" font-size="11">web fallback</text>
  <path d="M390,436 L406,478 L690,478 L690,506" fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="472" text-anchor="middle" fill="#9aa0a6" font-size="11">retrieve top-k</text>
  <line x1="630" y1="444" x2="760" y2="506" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="466" fill="#9aa0a6" font-size="11">index · list · delete</text>

  <!-- Row 4: external services -->
  <rect x="60" y="510" width="300" height="84" rx="16" fill="#1e1f20" stroke="#3c4043" stroke-dasharray="6 4"/>
  <text x="210" y="536" text-anchor="middle" fill="#e3e3e3" font-size="15">LLM · llm_provider.py</text>
  <text x="210" y="556" text-anchor="middle" fill="#9aa0a6" font-size="12">Groq (default) · Ollama (local) · OpenAI</text>
  <text x="210" y="572" text-anchor="middle" fill="#9aa0a6" font-size="12">picked by LLM_PROVIDER</text>

  <rect x="385" y="510" width="200" height="84" rx="16" fill="#1e1f20" stroke="#3c4043" stroke-dasharray="6 4"/>
  <text x="485" y="536" text-anchor="middle" fill="#e3e3e3" font-size="15">Firecrawl</text>
  <text x="485" y="556" text-anchor="middle" fill="#9aa0a6" font-size="12">live web search</text>
  <text x="485" y="572" text-anchor="middle" fill="#9aa0a6" font-size="12">only below threshold</text>

  <rect x="610" y="510" width="430" height="84" rx="16" fill="#1e1f20" stroke="#3c4043" stroke-dasharray="6 4"/>
  <text x="825" y="536" text-anchor="middle" fill="#e3e3e3" font-size="15">Milvus vector store</text>
  <text x="825" y="556" text-anchor="middle" fill="#9aa0a6" font-size="12">Milvus Lite file — local, Docker volume, Space default</text>
  <text x="825" y="572" text-anchor="middle" fill="#9aa0a6" font-size="12">Zilliz Cloud — via HONESTRAG_MILVUS_URI / _TOKEN</text>

  <!-- divider -->
  <line x1="40" y1="626" x2="1060" y2="626" stroke="#3c4043"/>

  <!-- ============================ DELIVERY ============================ -->
  <text x="40" y="656" fill="#81c995" font-size="13" font-weight="600" letter-spacing="2">DELIVERY</text>

  <rect x="40" y="690" width="160" height="72" rx="14" fill="#1e1f20" stroke="#3c4043"/>
  <text x="120" y="720" text-anchor="middle" fill="#e3e3e3" font-size="15">git push / PR</text>
  <text x="120" y="740" text-anchor="middle" fill="#9aa0a6" font-size="12">or tag vX.Y.Z</text>
  <line x1="200" y1="726" x2="236" y2="726" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="668" width="400" height="116" rx="16" fill="#1e1f20" stroke="#81c995" stroke-width="1.5"/>
  <text x="440" y="694" text-anchor="middle" fill="#e3e3e3" font-size="15">GitHub Actions · ci.yml (every push &amp; PR)</text>
  <text x="440" y="718" text-anchor="middle" fill="#9aa0a6" font-size="12">lint — uv lock --check · ruff</text>
  <text x="440" y="738" text-anchor="middle" fill="#9aa0a6" font-size="12">test — pytest on Python 3.11 + 3.12 (no API keys)</text>
  <text x="440" y="758" text-anchor="middle" fill="#9aa0a6" font-size="12">docker — build · offline-model · boot smoke tests</text>

  <path d="M640,726 L680,726" stroke="#81c995" stroke-width="1.5" fill="none"/>
  <text x="660" y="714" text-anchor="middle" fill="#81c995" font-size="11">tag</text>
  <line x1="680" y1="726" x2="716" y2="686" stroke="#81c995" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="680" y1="726" x2="716" y2="740" stroke="#81c995" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="680" y1="726" x2="716" y2="800" stroke="#81c995" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="720" y="660" width="340" height="48" rx="12" fill="#1e1f20" stroke="#3c4043"/>
  <text x="890" y="681" text-anchor="middle" fill="#e3e3e3" font-size="14">GHCR image</text>
  <text x="890" y="699" text-anchor="middle" fill="#9aa0a6" font-size="12">ghcr.io/tsk29/honestrag:X.Y.Z</text>

  <rect x="720" y="718" width="340" height="44" rx="12" fill="#1e1f20" stroke="#3c4043"/>
  <text x="890" y="745" text-anchor="middle" fill="#e3e3e3" font-size="14">GitHub Release</text>

  <rect x="720" y="772" width="340" height="60" rx="12" fill="#1e1f20" stroke="#a8c7fa"/>
  <text x="890" y="796" text-anchor="middle" fill="#e3e3e3" font-size="14">deploy.yml → Hugging Face Space</text>
  <text x="890" y="815" text-anchor="middle" fill="#9aa0a6" font-size="12">Gradio app · free ZeroGPU · private · rollback by tag</text>

  <line x1="440" y1="784" x2="440" y2="818" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="822" width="400" height="56" rx="14" fill="#1e1f20" stroke="#3c4043"/>
  <text x="440" y="846" text-anchor="middle" fill="#e3e3e3" font-size="14">Docker Compose (local)</text>
  <text x="440" y="865" text-anchor="middle" fill="#9aa0a6" font-size="12">Streamlit image · persistent volume · optional Ollama</text>
</svg>
