# CI/CD pipeline
#
#   lint ──┐
#          ├──> docker (build → smoke test → push to GHCR*) ──> release* ──> deploy*
#   test ──┘                                                  (* tags only)
#
# - Every push to main / PR: lint, unit tests on 3.11 + 3.12, eval-harness
#   smoke run, Docker image build and container smoke tests. Nothing is
#   published - main stays deployable, but only a tag ships.
# - Push of a tag vX.Y.Z: the tag must match pyproject.toml's version; the
#   image is pushed to GHCR as :X.Y.Z, :X.Y and :latest, a GitHub Release is
#   cut, and the Gradio app at that tag is deployed to the Hugging Face Space
#   (deploy.yml - skipped until the HF_SPACE variable is configured).
#
# No job needs an API key: all LLM / Firecrawl calls are mocked in tests.

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tsk29/honestrag  # GHCR requires lowercase
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check
      - name: Ruff
        run: uvx ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies (incl. the Space's Gradio extra)
        run: uv sync --frozen --all-extras
      - name: Unit tests
        run: uv run pytest -v --junitxml=pytest-report.xml
      - name: Eval harness smoke test (mock LLM)
        run: uv run python eval/run_eval.py --mock
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-report.xml

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pyproject version
        if: env.IS_RELEASE == 'true'
        run: |
          project_version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "v${project_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${project_version}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.IS_RELEASE }}
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: honestrag:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - dependencies import inside the image
        run: |
          docker run --rm honestrag:ci python -c "
          import workflow, llm_provider, knowledge_base, rag_service
          from llama_index.vector_stores.milvus import MilvusVectorStore
          from llama_index.embeddings.fastembed import FastEmbedEmbedding
          import streamlit
          print('imports ok')"

      - name: Smoke test - baked embedding model works with no network
        run: |
          docker run --rm --network none honestrag:ci python -c "
          import os
          from llama_index.embeddings.fastembed import FastEmbedEmbedding
          m = FastEmbedEmbedding(model_name='BAAI/bge-large-en-v1.5',
                                 cache_dir=os.environ['HONESTRAG_EMBED_CACHE_DIR'], local_files_only=True)
          assert len(m.get_text_embedding('hello')) == 1024
          print('offline embedding ok')"

      - name: Smoke test - container becomes healthy
        run: |
          docker run -d --name honestrag-smoke -p 8501:8501 honestrag:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' honestrag-smoke)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          curl -fsS http://localhost:8501/_stcore/health
          curl -fsS http://localhost:8501/ | grep -q "<title>"
          test "$(docker inspect -f '{{.Config.User}}' honestrag-smoke)" = "app"

      - name: Container logs
        if: always()
        run: docker logs honestrag-smoke || true

      - name: Log in to GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: that's what Hugging Face Spaces and most hosts run, and an
      # emulated arm64 build would add 15-30 min per release. Apple Silicon
      # users can still `docker compose up --build` locally.
      - name: Push image
        if: env.IS_RELEASE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.docker.outputs.version }}
        run: |
          printf '## Container image\n\n```bash\ndocker pull %s:%s\n```\n' "$IMAGE_NAME" "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" --generate-notes --notes-file notes.md

  deploy:
    needs: [docker, release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.HF_SPACE != ''
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit
